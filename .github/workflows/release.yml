name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Check tag matches package version
        run: |
          version="$(uv run --no-project python -c "import sys; sys.path.insert(0, 'src'); import listgrok; print(listgrok.__version__)")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match __version__ $version" >&2
            exit 1
          fi

      - name: Build
        run: uv build
      - name: Smoke test the built wheel
        run: uv run --isolated --no-project --with dist/*.whl python -c "import listgrok, pathlib; print(listgrok.parse_list(pathlib.Path('examples/official_app/official_1.txt').read_text()).name)"

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
