name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # The oldest supported interpreter — the on-main matrix covers the rest.
          python-version: "3.10"

      - name: Check tag matches package version
        run: |
          version="$(uv run --no-project python -c "import sys; sys.path.insert(0, 'src'); import listgrok; print(listgrok.__version__)")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match __version__ $version" >&2
            exit 1
          fi

      # A PyPI version number can never be reused, so re-run the checks against
      # the exact tagged commit rather than trusting whatever main last ran.
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Typecheck
        run: make typecheck

      - name: Build
        run: uv build
      - name: Smoke test the built wheel
        run: uv run --isolated --no-project --with dist/*.whl python -c "import listgrok, pathlib; print(listgrok.parse_list(pathlib.Path('examples/official_app/official_1.txt').read_text()).name)"

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
