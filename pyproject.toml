[project]
name = "listgrok"
dynamic = ["version"]
description = "Warhammer 40k 11th edition list parser"
authors = [
    { name = "powens", email = "1919554+powens@users.noreply.github.com" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
keywords = ["warhammer", "40k", "parser", "army-list", "gaming"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.urls]
"Homepage" = "https://github.com/powens/listgrok"
"Bug Reports" = "https://github.com/powens/listgrok/issues"
"Source" = "https://github.com/powens/listgrok"
"Documentation" = "https://github.com/powens/listgrok#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "coverage>=7.7.0",
    "pytest>=9.0.3",
    "pytest-cov>=6.2.1",
    "pytest-random-order>=1.1.1",
    "ty>=0.0.37",
]
lint = [
    "ruff>=0.14",
]

[tool.pytest.ini_options]
pythonpath = [
    "src",
]
addopts = "--random-order"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.coverage.run]
source = ["listgrok"]

[tool.hatch.version]
path = "src/listgrok/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "src/listgrok",
    "tests",
    "examples",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]
